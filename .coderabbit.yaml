reviews:
  auto_review:
    enabled: true
    drafts: true # include draft PRs
    base_branches:
      - ".*" # regex: any target branch
    auto_incremental_review: true # re-review on every push
    auto_pause_after_reviewed_commits: 0 # never auto-pause
    ignore_title_keywords: []
    ignore_usernames: []
    labels: []
