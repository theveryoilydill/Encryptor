# CodeQL configuration for the Encryptor repo.
# # Mr. AI Acting on s183173's Behalf
#
# Query exclusions (each with a maintainer-reviewed rationale):
#
# js/xss-through-dom:
#   Excluded as a reviewed FALSE POSITIVE for this codebase. Every URL that
#   reaches an <img src> flows through a strict, charset-enforced allow-list:
#     - src/lib/pgp/envelope.ts#isSafeImageUrl  — encrypt-side previews
#       (data:image/* base64, blob:, https:)
#     - src/lib/pgp/envelope.ts#isLocalImageUrl — decrypted-message views
#       (data:image/* base64 ONLY; remote https: is deliberately blocked so
#       a decrypted message cannot load tracking pixels)
#   React's auto-escaping covers all other text sinks, and the single
#   dangerouslySetInnerHTML (components/ui/chart.tsx, shadcn boilerplate)
#   interpolates theme colors from local config, never user content. The
#   same alert was manually dismissed on main as a false positive
#   (security/code-scanning/1, reason: "false positive", 2026-09-12);
#   this config encodes that decision so PR checks stay deterministic when
#   the guarded files are reformatted or touched.
name: "Encryptor CodeQL config"

query-filters:
  - exclude:
      id: js/xss-through-dom
