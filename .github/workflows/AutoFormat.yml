name: Auto Format

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    # Fork PRs get a read-only GITHUB_TOKEN, so the push below can never
    # succeed for them — skip instead of failing with a permanent red X.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: format-${{ github.event.pull_request.number || github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format code
        run: bun run fmt

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add .

          if git diff --staged --quiet; then
            echo "No formatting changes to commit"
            exit 0
          fi

          git commit -m "chore: auto-format code"
          git push origin "HEAD:${TARGET_BRANCH}"
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
