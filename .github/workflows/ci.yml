name: CI

# Run on every branch: push builds on feature branches, pull_request
# checks PRs against any base — not just main/master/develop.
on:
  push:
  pull_request:

# One run per branch per event type at a time. The group is keyed by
# branch name (head_ref on pull_request events, ref_name on push events)
# plus the event name, so rapid pushes or PR updates supersede stale
# runs without a push run ever cancelling a PR run that is in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Dedupe guard: when an open PR already has this branch as its head,
  # the pull_request run is the check — a push run for the same commit
  # would just duplicate it, so skip. Branches without an open PR (e.g.
  # the default branch) keep their push runs.
  guard:
    name: dedupe (skip push runs covered by a PR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo "Event is $EVENT_NAME — always run."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          open_prs=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq length)
          if [ "$open_prs" -gt 0 ]; then
            echo "Open PR covers '$BRANCH' — skipping push run (the PR run is the check)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No open PR for '$BRANCH' — running."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: typecheck and lint
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (oxlint)
        run: bun run lint
