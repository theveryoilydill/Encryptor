name: Reset preview D1 daily

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-preview-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Reset preview registry data
        run: |
          cat > /tmp/reset-preview-registry.sql <<'SQL'
          BEGIN;
          DELETE FROM registry_challenges;
          DELETE FROM registry_rate;
          DELETE FROM registry_audit;
          DELETE FROM registry_keys;
          COMMIT;
          SQL
          bunx wrangler d1 execute REGISTRY_DB --env preview --remote --file /tmp/reset-preview-registry.sql
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
