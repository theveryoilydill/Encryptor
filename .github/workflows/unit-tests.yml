name: Unit tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Allow manual runs from the Actions tab (useful for testing with creds).
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests (mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests (no Keybase credentials)
        run: bun run test
        env:
          INTEGRATION: "false"

  integration:
    name: unit tests (live Keybase login)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run the live integration job if the Keybase test credentials are
    # available as repository secrets. If you haven't set them yet, this job
    # is skipped silently — see the README for setup instructions.
    env:
      KEYBASE_TEST_USERNAME: ${{ secrets.KEYBASE_TEST_USERNAME }}
      KEYBASE_TEST_PASS: ${{ secrets.KEYBASE_TEST_PASS }}
      INTEGRATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check required secrets
        id: check_secrets
        run: |
          if [ -z "${KEYBASE_TEST_USERNAME}" ] || [ -z "${KEYBASE_TEST_PASS}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping live Keybase login test — set KEYBASE_TEST_USERNAME and KEYBASE_TEST_PASS secrets to enable."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run integration tests against real Keybase API
        if: steps.check_secrets.outputs.skip != 'true'
        run: bun run test
        env:
          INTEGRATION: "true"
          KEYBASE_TEST_USERNAME: ${{ secrets.KEYBASE_TEST_USERNAME }}
          KEYBASE_TEST_PASS: ${{ secrets.KEYBASE_TEST_PASS }}

      - name: Skip integration tests (no secrets)
        if: steps.check_secrets.outputs.skip == 'true'
        run: echo "::notice::Live Keybase integration tests were skipped. Add the KEYBASE_TEST_USERNAME and KEYBASE_TEST_PASS repository secrets to run them."
